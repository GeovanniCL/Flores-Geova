<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#11101b">
<title>Flores amarillas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scene">
  <div class="stars"></div>
  <div class="glow"></div>

  <main class="bouquet">
    <svg viewBox="0 0 600 720" class="art" aria-label="Ramo de flores amarillas">
      <defs>
        <radialGradient id="yellow" cx="35%" cy="25%">
          <stop offset="0" stop-color="#fff56b"/>
          <stop offset=".65" stop-color="#ffd52d"/>
          <stop offset="1" stop-color="#e8a900"/>
        </radialGradient>
        <radialGradient id="brown" cx="35%" cy="30%">
          <stop offset="0" stop-color="#d99b18"/>
          <stop offset=".55" stop-color="#a96700"/>
          <stop offset="1" stop-color="#704000"/>
        </radialGradient>
        <linearGradient id="green" x1="0" x2="1">
          <stop stop-color="#17633d"/>
          <stop offset=".5" stop-color="#55bd79"/>
          <stop offset="1" stop-color="#17633d"/>
        </linearGradient>
        <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
          <stop stop-color="#6fd18d"/>
          <stop offset="1" stop-color="#17613d"/>
        </linearGradient>
        <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
          <stop stop-color="#fffef8"/>
          <stop offset=".55" stop-color="#f3ead7"/>
          <stop offset="1" stop-color="#d8ccb4"/>
        </linearGradient>
        <filter id="shadow">
          <feDropShadow dx="0" dy="12" stdDeviation="10" flood-opacity=".35"/>
        </filter>
        <filter id="soft">
          <feGaussianBlur stdDeviation="16"/>
        </filter>
      </defs>

      <ellipse cx="300" cy="315" rx="235" ry="225" fill="#ffd632" opacity=".13" filter="url(#soft)"/>

      <!-- TALLOS: cortos y juntos -->
      <g class="stems" stroke="url(#green)" stroke-width="8" fill="none" stroke-linecap="round">
        <path d="M300 560 Q285 405 105 245"/>
        <path d="M300 560 Q292 390 165 185"/>
        <path d="M300 560 Q296 370 230 150"/>
        <path d="M300 560 Q300 360 300 125"/>
        <path d="M300 560 Q305 370 370 150"/>
        <path d="M300 560 Q308 390 435 185"/>
        <path d="M300 560 Q315 405 495 245"/>
        <path d="M300 560 Q280 420 215 225"/>
        <path d="M300 560 Q320 420 385 225"/>
      </g>

      <!-- HOJAS -->
      <g class="leaves">
        <path d="M226 420 Q130 408 112 345 Q180 340 226 420Z" fill="url(#leaf)"/>
        <path d="M374 420 Q470 408 488 345 Q420 340 374 420Z" fill="url(#leaf)"/>
        <path d="M255 470 Q175 463 158 415 Q215 410 255 470Z" fill="url(#leaf)"/>
        <path d="M345 470 Q425 463 442 415 Q385 410 345 470Z" fill="url(#leaf)"/>
        <path d="M218 355 Q155 325 158 280 Q207 295 218 355Z" fill="url(#leaf)"/>
        <path d="M382 355 Q445 325 442 280 Q393 295 382 355Z" fill="url(#leaf)"/>
      </g>

      <!-- FLORES TRASERAS -->
      <g class="flower f1" transform="translate(105 245) scale(.82)"><use href="#flowerShape"/></g>
      <g class="flower f2" transform="translate(165 185) scale(.92)"><use href="#flowerShape"/></g>
      <g class="flower f3" transform="translate(230 150) scale(.95)"><use href="#flowerShape"/></g>
      <g class="flower f4" transform="translate(300 125) scale(.98)"><use href="#flowerShape"/></g>
      <g class="flower f5" transform="translate(370 150) scale(.95)"><use href="#flowerShape"/></g>
      <g class="flower f6" transform="translate(435 185) scale(.92)"><use href="#flowerShape"/></g>
      <g class="flower f7" transform="translate(495 245) scale(.82)"><use href="#flowerShape"/></g>

      <!-- FLORES DELANTERAS: rellenan el centro -->
      <g class="flower front f8" transform="translate(180 265) scale(.88)"><use href="#flowerShape"/></g>
      <g class="flower front f9" transform="translate(250 235) scale(.94)"><use href="#flowerShape"/></g>
      <g class="flower front f10" transform="translate(350 235) scale(.94)"><use href="#flowerShape"/></g>
      <g class="flower front f11" transform="translate(420 265) scale(.88)"><use href="#flowerShape"/></g>
      <g class="flower front f12" transform="translate(300 275) scale(1.02)"><use href="#flowerShape"/></g>

      <!-- Definición de una flor, reutilizada -->
      <g id="flowerShape">
        <circle r="43" cx="0" cy="-25" fill="url(#yellow)"/>
        <circle r="43" cx="24" cy="-8" fill="url(#yellow)"/>
        <circle r="43" cx="15" cy="22" fill="url(#yellow)"/>
        <circle r="43" cx="-15" cy="22" fill="url(#yellow)"/>
        <circle r="43" cx="-24" cy="-8" fill="url(#yellow)"/>
        <circle r="31" fill="url(#brown)"/>
        <circle r="21" fill="#a96b00" opacity=".72"/>
      </g>

      <!-- ENVOLTURA -->
      <g class="wrapper" filter="url(#shadow)">
        <path d="M155 450 L445 450 L385 650 L215 650 Z" fill="url(#paper)"/>
        <path d="M155 450 L300 478 L215 650 L190 610 Z" fill="#fffef8" opacity=".9"/>
        <path d="M445 450 L300 478 L385 650 L410 610 Z" fill="#e2d7c2" opacity=".8"/>
        <path d="M155 450 L445 450 L425 500 L175 500 Z" fill="#fffef8"/>
        <path d="M175 500 Q300 520 425 500" fill="none" stroke="#d6c9b2" stroke-width="2"/>

        <!-- cinta -->
        <path d="M240 555 Q190 535 170 555 Q195 578 242 568Z" fill="#e5a812"/>
        <path d="M360 555 Q410 535 430 555 Q405 578 358 568Z" fill="#e5a812"/>
        <path d="M238 550 L362 550 L354 578 L246 578Z" fill="#f4bd22"/>
        <circle cx="300" cy="564" r="23" fill="#ffd947"/>
        <circle cx="300" cy="564" r="15" fill="#e5a812"/>
        <path d="M300 552 L304 560 L313 561 L306 567 L308 576 L300 571 L292 576 L294 567 L287 561 L296 560Z" fill="#fff9c8"/>
      </g>
    </svg>
  </main>

  <div class="message">Para ti, con cariño <span>♥</span></div>
</div>
</body>
</html>
