<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flores amarillas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <div class="glow"></div>

    <section class="bouquet" aria-label="Ramo de flores amarillas animado">
      <div class="flowers">
        <div class="flower f1"><span class="petals"></span><span class="center"></span></div>
        <div class="flower f2"><span class="petals"></span><span class="center"></span></div>
        <div class="flower f3"><span class="petals"></span><span class="center"></span></div>
        <div class="flower f4"><span class="petals"></span><span class="center"></span></div>
        <div class="flower f5"><span class="petals"></span><span class="center"></span></div>
        <div class="flower f6"><span class="petals"></span><span class="center"></span></div>
        <div class="flower f7"><span class="petals"></span><span class="center"></span></div>
      </div>

      <div class="stems">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="leaves">
        <i class="leaf l1"></i><i class="leaf l2"></i><i class="leaf l3"></i>
        <i class="leaf l4"></i><i class="leaf l5"></i><i class="leaf l6"></i>
      </div>

      <div class="wrap">
        <div class="paper paper-back"></div>
        <div class="paper paper-front"></div>
        <div class="ribbon">
          <span></span><b>✦</b><span></span>
        </div>
      </div>
    </section>

    <p class="message">Para ti, con cariño 💛</p>
  </main>
</body>
</html>
